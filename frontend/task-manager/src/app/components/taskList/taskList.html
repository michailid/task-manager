<div class="main-container">
  <h1>Task Manager</h1>
  <input type="text" class="task-input" [(ngModel)]="taskToAdd" placeholder="Type task..." />
  <button class="add-task-btn" (click)="addTask(taskToAdd)">Add</button>

  <div class="task-list">
    @for (task of tasks(); track $index) {
      <div class="task">
        <div class="task-title">{{ task.title }}</div>
        <button class="delete-task-btn" (click)="deleteTask(task.id!)">Delete</button>
      </div>
    }
  </div>
</div>
